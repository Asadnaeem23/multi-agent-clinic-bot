<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bright Smile Dental | AI Assistant</title>
    <meta name="description" content="Chat with our AI assistant for instant dental care help, appointments, and information.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/chat.css">
</head>
<body>
    <!-- Intro Screen -->
    <div id="intro-screen" class="intro-screen">
        <div class="intro-bg-orbs">
            <div class="orb orb-1"></div>
            <div class="orb orb-2"></div>
            <div class="orb orb-3"></div>
        </div>
        <div class="intro-card">
            <div class="intro-logo">
                <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                    <rect width="48" height="48" rx="16" fill="url(#logo-grad)"/>
                    <path d="M24 12C18 12 14 16 14 20C14 24 16 26 18 28C20 30 20 32 20 34H28C28 32 28 30 30 28C32 26 34 24 34 20C34 16 30 12 24 12Z" fill="white" opacity="0.9"/>
                    <rect x="20" y="34" width="8" height="3" rx="1" fill="white" opacity="0.7"/>
                    <defs>
                        <linearGradient id="logo-grad" x1="0" y1="0" x2="48" y2="48">
                            <stop stop-color="#6366f1"/>
                            <stop offset="1" stop-color="#8b5cf6"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <h1 class="intro-title">Bright Smile Dental</h1>
            <p class="intro-subtitle">Chat with our AI assistant for instant help with appointments, services, and more.</p>
            
            <div class="intro-form">
                <div class="input-group">
                    <label for="user-name">Your Name</label>
                    <input type="text" id="user-name" placeholder="e.g. John Doe" autocomplete="name">
                </div>
                <div class="input-group">
                    <label for="user-email">Your Email</label>
                    <input type="email" id="user-email" placeholder="e.g. john@example.com" autocomplete="email">
                </div>
                <button id="start-chat-btn" class="btn-primary" onclick="startChat()">
                    <span>Start Conversation</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </button>
            </div>
            
            <div class="intro-features">
                <div class="feature-item">
                    <div class="feature-icon">⚡</div>
                    <span>Instant Responses</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">📅</div>
                    <span>Book Appointments</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🦷</div>
                    <span>Service Info</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Chat Screen -->
    <div id="chat-screen" class="chat-screen hidden">
        <!-- Chat Header -->
        <div class="chat-header">
            <div class="chat-header-left">
                <div class="chat-avatar">
                    <svg width="24" height="24" viewBox="0 0 48 48" fill="none">
                        <rect width="48" height="48" rx="16" fill="url(#h-grad)"/>
                        <path d="M24 12C18 12 14 16 14 20C14 24 16 26 18 28C20 30 20 32 20 34H28C28 32 28 30 30 28C32 26 34 24 34 20C34 16 30 12 24 12Z" fill="white" opacity="0.9"/>
                        <defs>
                            <linearGradient id="h-grad" x1="0" y1="0" x2="48" y2="48">
                                <stop stop-color="#6366f1"/>
                                <stop offset="1" stop-color="#8b5cf6"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div class="chat-header-info">
                    <h2>Bright Smile Dental</h2>
                    <div class="chat-status">
                        <span class="status-dot"></span>
                        <span>AI Assistant • Online</span>
                    </div>
                </div>
            </div>
            <a href="admin.html" class="admin-link" title="Admin Dashboard">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
                </svg>
            </a>
        </div>

        <!-- Messages Area -->
        <div id="messages-area" class="messages-area">
            <!-- Messages will be injected here -->
        </div>

        <!-- Chat Input -->
        <div class="chat-input-bar">
            <div class="chat-input-wrapper">
                <input type="text" id="chat-input" placeholder="Type your message..." autocomplete="off">
                <button id="send-btn" class="send-btn" onclick="sendMessage()" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="js/chat.js"></script>
</body>
</html>
